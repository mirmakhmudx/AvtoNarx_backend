openapi: 3.1.0

info:
  title: AvtoNarx Backend API
  version: "1.0.0"
  description: |


servers:
  - url: /
    description: Current host

tags:
  - name: Public
    description: Open (no authentication) endpoints for the frontend.
  - name: Ingestion
    description: Data ingestion endpoints for the parser (Bearer token).
  - name: Health
    description: Liveness and readiness endpoints (TZ 20).

security: []

paths:

  /api/v1/brands:
    get:
      tags: [Public]
      summary: List of active brands
      responses:
        "200":
          description: List of brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Brand" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/brands/{slug}:
    get:
      tags: [Public]
      summary: Get a single brand by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Brand" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/brands/{brandSlug}/models:
    get:
      tags: [Public]
      summary: Brand models (with official and market price), paginated
      parameters:
        - name: brandSlug
          in: path
          required: true
          schema: { type: string }
        - name: year
          in: query
          required: false
          schema: { type: integer }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CarModel" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/models/{carModel}/prices:
    get:
      tags: [Public]
      summary: Yearly market prices and official price for a model
      parameters:
        - name: carModel
          in: path
          required: true
          description: Model ID
          schema: { type: integer }
        - name: year
          in: query
          required: false
          schema: { type: integer }
        - name: region
          in: query
          required: false
          description: Region code (e.g. `tashkent`). If omitted — whole country.
          schema: { type: string }
      responses:
        "200":
          description: Price statistics
          headers:
            ETag:
              schema: { type: string }
            Last-Modified:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPrices" }
        "304":
          description: Not modified (If-None-Match matched)
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/filters:
    get:
      tags: [Public]
      summary: Filter values (years, regions)
      parameters:
        - name: brand
          in: query
          required: false
          description: Restrict filters by brand slug
          schema: { type: string }
      responses:
        "200":
          description: Filter values
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      brand:
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              id: { type: integer }
                              slug: { type: string }
                              name: { type: string }
                      years:
                        type: array
                        items: { type: integer }
                      regions:
                        type: array
                        items: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/ingestion/market-listings/batches:
    post:
      tags: [Ingestion]
      summary: Submit a batch of market listings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketListingBatch" }
      responses:
        "202": { $ref: "#/components/responses/BatchAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/ingestion/official-offers/batches:
    post:
      tags: [Ingestion]
      summary: Submit a batch of official offers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficialOfferBatch" }
      responses:
        "202": { $ref: "#/components/responses/BatchAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/ingestion/batches/{batchId}:
    get:
      tags: [Ingestion]
      summary: Batch status and (first 20) errors
      security:
        - bearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Batch status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BatchStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ingestion/batches/{batchId}/errors:
    get:
      tags: [Ingestion]
      summary: Batch item errors (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated list of errors (Laravel paginator)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ItemError" }
                  current_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
                  last_page: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ingestion/heartbeat:
    post:
      tags: [Ingestion]
      summary: Parser "alive" signal (updates last_seen_at)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, examples: ["ok"] }
                  server_time: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/ingestion/catalog:
    get:
      tags: [Ingestion]
      summary: Catalog of active brands/models (for parser normalization)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      brands:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            slug: { type: string }
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            brand_id: { type: integer }
                            name: { type: string }
                            slug: { type: string }
                      catalog_version: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /up:
    get:
      tags: [Health]
      summary: Liveness (Laravel default)
      responses:
        "200":
          description: Application is running

  /health/live:
    get:
      tags: [Health]
      summary: Liveness — is the process alive (no dependencies)
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: ["alive"] }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness — DB and cache check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
        "503":
          description: Not ready (a dependency is down)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Idempotency key for the batch (UUID).
      schema: { type: string, format: uuid }

  schemas:

    Brand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        country_code:
          oneOf:
            - type: "null"
            - type: string
        models_count:
          type: integer
          description: Present only when the carModels count has been loaded.

    CarModel:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        production_from:
          oneOf: [{ type: "null" }, { type: integer }]
        production_to:
          oneOf: [{ type: "null" }, { type: integer }]
        official_price: { $ref: "#/components/schemas/OfficialPrice" }
        market_price: { $ref: "#/components/schemas/MarketPrice" }

    OfficialPrice:
      description: Official price, or null.
      oneOf:
        - type: "null"
        - type: object
          properties:
            amount: { type: integer }
            currency: { type: string, examples: ["UZS"] }
            observed_at:
              oneOf: [{ type: "null" }, { type: string, format: date-time }]
            source_url:
              oneOf: [{ type: "null" }, { type: string }]

    MarketPrice:
      description: Representative market price (median), or null.
      oneOf:
        - type: "null"
        - type: object
          properties:
            amount: { type: integer }
            currency: { type: string, examples: ["UZS"] }
            statistic: { type: string, examples: ["median"] }
            sample_size: { type: integer }
            period_from:
              oneOf: [{ type: "null" }, { type: string, format: date-time }]
            period_to:
              oneOf: [{ type: "null" }, { type: string, format: date-time }]
            method_version: { type: string }

    ModelPrices:
      type: object
      properties:
        model_id: { type: integer }
        model_name: { type: string }
        region:
          oneOf: [{ type: "null" }, { type: string }]
        official_price: { $ref: "#/components/schemas/OfficialPrice" }
        market_prices:
          type: array
          items: { $ref: "#/components/schemas/MarketPricesEntry" }

    MarketPricesEntry:
      description: Statistics for one year (ok), or an insufficient-data state.
      oneOf:
        - type: object
          title: OK
          properties:
            year:
              oneOf: [{ type: "null" }, { type: integer }]
            status: { type: string, examples: ["ok"] }
            currency: { type: string }
            sample_size: { type: integer }
            excluded_count: { type: integer }
            median_uzs: { type: integer }
            mean_uzs: { type: integer }
            min_uzs: { type: integer }
            max_uzs: { type: integer }
            p25_uzs: { type: integer }
            p75_uzs: { type: integer }
            method_version: { type: string }
            calculated_at:
              oneOf: [{ type: "null" }, { type: string, format: date-time }]
        - type: object
          title: Insufficient
          properties:
            year:
              oneOf: [{ type: "null" }, { type: integer }]
            status: { type: string, examples: ["insufficient_sample", "no_data"] }
            sample_size: { type: integer }
            min_required: { type: integer }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    MarketListingBatch:
      type: object
      required: [batch_id, source, mode, collected_at, items]
      properties:
        batch_id: { type: string, format: uuid }
        source: { type: string, description: "Source code (sources.code)." }
        mode: { type: string, enum: [incremental, snapshot, offline_html] }
        parser_version: { type: string, maxLength: 50 }
        collected_at: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/MarketListingItem" }

    MarketListingItem:
      type: object
      required: [external_id, url, brand, model, year, price, observed_at, content_hash]
      properties:
        external_id: { type: string, maxLength: 255 }
        url: { type: string, format: uri, maxLength: 1000, description: "Must belong to the source's domain." }
        brand: { type: string, maxLength: 180 }
        model: { type: string, maxLength: 180 }
        year: { type: integer, minimum: 1950, description: "Upper bound: current year + 1." }
        price: { $ref: "#/components/schemas/Price" }
        condition: { type: string, enum: [new, used, unknown] }
        seller_type: { type: string }
        location:
          type: object
          properties:
            region: { type: string, maxLength: 180 }
            city: { type: string, maxLength: 180 }
        observed_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        content_hash: { type: string, pattern: "^[0-9a-fA-F]{64}$", description: "SHA-256 (64 hex chars)." }

    OfficialOfferBatch:
      type: object
      required: [batch_id, source, mode, collected_at, items]
      properties:
        batch_id: { type: string, format: uuid }
        source: { type: string }
        mode: { type: string, enum: [incremental, snapshot, offline_html] }
        parser_version: { type: string, maxLength: 50 }
        collected_at: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/OfficialOfferItem" }

    OfficialOfferItem:
      type: object
      required: [external_id, url, brand, model, price, observed_at, content_hash]
      properties:
        external_id: { type: string, maxLength: 255 }
        url: { type: string, maxLength: 1000 }
        brand: { type: string, maxLength: 180 }
        model: { type: string, maxLength: 180 }
        trim: { type: string, maxLength: 180 }
        year: { type: integer, minimum: 1950 }
        price: { $ref: "#/components/schemas/Price" }
        observed_at: { type: string, format: date-time }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        content_hash: { type: string, minLength: 64, maxLength: 64 }

    Price:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 1, description: "Whole number (in so'm, not tiyin)." }
        currency: { type: string, enum: [UZS, USD] }

    BatchAcceptedBody:
      type: object
      properties:
        data:
          type: object
          properties:
            batch_id: { type: string, format: uuid }
            status: { type: string, examples: ["received"] }
            items_total: { type: integer }
            status_url: { type: string }
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
            note: { type: string, description: "Present on an idempotent repeat request." }

    BatchStatus:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        dataset: { type: string }
        status: { type: string, examples: ["received", "processing", "completed", "failed"] }
        items_total: { type: integer }
        items_accepted: { type: integer }
        items_rejected: { type: integer }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ItemError" }
        completed_at:
          oneOf: [{ type: "null" }, { type: string, format: date-time }]

    ItemError:
      type: object
      properties:
        item_index: { type: integer }
        external_id:
          oneOf: [{ type: "null" }, { type: string }]
        code: { type: string, examples: ["invalid_year", "unmatched_brand", "implausible_price"] }
        field:
          oneOf: [{ type: "null" }, { type: string }]
        message: { type: string }

    ReadinessStatus:
      type: object
      properties:
        status: { type: string, examples: ["ready", "not_ready"] }
        checks:
          type: object
          properties:
            database: { type: string, examples: ["ok", "fail"] }
            cache: { type: string, examples: ["ok", "fail"] }

    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:

    BatchAccepted:
      description: Batch accepted (or an idempotent repeat)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BatchAcceptedBody" }

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Forbidden:
      description: Not allowed (client inactive / no access to source / foreign batch)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Conflict:
      description: duplicate_batch_conflict — same batch_id with different content/client
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ValidationFailed:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }

    TooManyRequests:
      description: Rate limit exceeded (TZ 13)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
