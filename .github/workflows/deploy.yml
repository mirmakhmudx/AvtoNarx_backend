name: Deploy

# main'ga push yoki v* teg qo'yilganda ishlaydi. Qo'lda ham ishga tushirsa bo'ladi.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (teglar)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # DEPLOY (SERVERGA) — bu qism SIZNING infratuzilmangizga bog'liq, shuning
  # uchun shablon sifatida qoldirilgan. Serveringiz turiga qarab birini yoqing:
  #
  #   • SSH orqali (VPS): appleboy/ssh-action bilan serverga kirib,
  #     `docker compose pull && docker compose up -d && php artisan migrate --force`.
  #   • Kubernetes: `kubectl set image ...` yoki ArgoCD/Flux.
  #   • Laravel Forge / Envoyer: webhook orqali.
