server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 20M;

    # Docker'ning ichki DNS'i — "app" konteyner qayta qurilib yangi IP
    # olganda (masalan har bir deploy'da), nginx bu yerdagi $upstream_app
    # o'zgaruvchisi orqali IP'ni har so'rovda qayta aniqlaydi (resolve),
    # config yuklanganda bir marta keshlab qolmaydi. Oddiy
    # "fastcgi_pass app:9000;" bilan bu keshlanib qolib, app qayta
    # qurilgandan keyin "Connection refused" (502) beradi edi.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
