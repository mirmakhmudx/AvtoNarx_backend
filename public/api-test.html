<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvtoNarx — API test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; padding: 24px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 14px; margin-bottom: 20px; }
  .crumb { color: #16a34a; font-size: 14px; margin-bottom: 16px; cursor: pointer; display:inline-block; }
  .crumb:hover { text-decoration: underline; }
  .toolbar { display:flex; gap:12px; align-items:center; margin: 8px 0 20px; flex-wrap:wrap; }
  .toolbar label { font-size:13px; color:#64748b; }
  select { padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; background:#fff; cursor:pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; cursor: pointer; transition: .15s; }
  .card:hover { border-color: #16a34a; box-shadow: 0 4px 12px rgba(0,0,0,.06); transform: translateY(-2px); }
  .card h3 { font-size: 16px; margin-bottom: 6px; }
  .badge { display:inline-block; background:#f1f5f9; color:#475569; font-size:11px; padding:2px 8px; border-radius:999px; }
  .price-row { display:flex; justify-content:space-between; margin-top:10px; font-size:14px; }
  .price-label { color:#64748b; }
  .price-official { color:#16a34a; font-weight:600; }
  .price-market { color:#2563eb; font-weight:600; }
  .muted { color:#94a3b8; font-style:italic; }
  .detail { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:24px; }
  .detail h2 { margin-bottom:16px; }
  .pricebox { display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .pricebox > div { flex:1; min-width:200px; padding:16px; border-radius:12px; }
  .pb-official { background:#f0fdf4; border:1px solid #bbf7d0; }
  .pb-market { background:#eff6ff; border:1px solid #bfdbfe; }
  .pb-big { font-size:24px; font-weight:700; margin-top:4px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid #f1f5f9; font-size:14px; }
  th { color:#64748b; font-weight:600; font-size:12px; text-transform:uppercase; }
  .loading { color:#94a3b8; padding:20px 0; }
  .err { color:#dc2626; padding:20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚗 AvtoNarx — API test</h1>
  <div class="sub">Brand → modellar → narx | yil & hudud filtri bilan</div>
  <div id="crumb"></div>
  <div id="toolbar"></div>
  <div id="content"><div class="loading">Yuklanmoqda…</div></div>
</div>

<script>
const API = "/api/v1";
const fmt = (n) => n == null ? "—" : new Intl.NumberFormat("ru-RU").format(n) + " so'm";
const el = document.getElementById("content");
const crumb = document.getElementById("crumb");
const toolbar = document.getElementById("toolbar");

let state = { slug:null, brandName:null, year:"", modelId:null, modelName:null, regions:[], years:[] };

async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function price(obj) {
  return obj && obj.amount != null ? fmt(obj.amount) : '<span class="muted">yo\'q</span>';
}

async function loadBrands() {
  crumb.innerHTML = ""; toolbar.innerHTML = "";
  state = { slug:null, brandName:null, year:"", modelId:null, modelName:null, regions:[], years:[] };
  el.innerHTML = '<div class="loading">Markalar yuklanmoqda…</div>';
  try {
    const { data } = await get("/brands");
    el.innerHTML = '<div class="grid">' + data.map(b => `
      <div class="card" onclick="loadModels('${b.slug}','${b.name.replace(/'/g,"\\'")}')">
        <h3>${b.name}</h3>
        <span class="badge">${b.models_count ?? '?'} model</span>
      </div>`).join("") + '</div>';
  } catch (e) { el.innerHTML = '<div class="err">Xato: ' + e.message + '</div>'; }
}

async function loadModels(slug, brandName, year="") {
  state.slug = slug; state.brandName = brandName; state.year = year;
  crumb.innerHTML = `<span class="crumb" onclick="loadBrands()">← Barcha markalar</span>`;
  el.innerHTML = '<div class="loading">Modellar yuklanmoqda…</div>';
  try {
    if (!state.years.length) {
      const f = await get(`/filters?brand=${slug}`);
      state.years = f.data.years || [];
      state.regions = f.data.regions || [];
    }
    const yearOpts = ['<option value="">Barcha yillar</option>']
      .concat(state.years.map(y => `<option value="${y}" ${y==year?'selected':''}>${y}</option>`)).join("");
    toolbar.innerHTML = `<label>Yil bo'yicha filtr:</label>
      <select onchange="loadModels('${slug}','${brandName.replace(/'/g,"\\'")}', this.value)">${yearOpts}</select>`;

    const q = year ? `?year=${year}` : "";
    const { data } = await get(`/brands/${slug}/models${q}`);
    if (!data.length) { el.innerHTML = '<div class="muted">Bu filtr bo\'yicha model yo\'q</div>'; return; }
    el.innerHTML = `<h2 style="margin-bottom:16px">${brandName} modellari ${year?`(${year})`:''}</h2><div class="grid">` + data.map(m => `
      <div class="card" onclick="loadPrices(${m.id},'${m.name.replace(/'/g,"\\'")}')">
        <h3>${m.name}</h3>
        <div class="price-row"><span class="price-label">Salon narxi</span><span class="price-official">${price(m.official_price)}</span></div>
        <div class="price-row"><span class="price-label">Bozor narxi</span><span class="price-market">${price(m.market_price)}</span></div>
      </div>`).join("") + '</div>';
  } catch (e) { el.innerHTML = '<div class="err">Xato: ' + e.message + '</div>'; }
}

async function loadPrices(id, name, year="", region="") {
  state.modelId = id; state.modelName = name;
  crumb.innerHTML = `<span class="crumb" onclick="loadModels('${state.slug}','${state.brandName.replace(/'/g,"\\'")}','${state.year}')">← ${state.brandName} modellari</span>`;
  el.innerHTML = '<div class="loading">Narxlar yuklanmoqda…</div>';

  const yearOpts = ['<option value="">Barcha yillar</option>']
    .concat(state.years.map(y => `<option value="${y}" ${y==year?'selected':''}>${y}</option>`)).join("");
  const regionOpts = ['<option value="">Butun O\'zbekiston</option>']
    .concat(state.regions.map(r => `<option value="${r}" ${r==region?'selected':''}>${r}</option>`)).join("");
  toolbar.innerHTML = `
    <label>Yil:</label>
    <select onchange="loadPrices(${id},'${name.replace(/'/g,"\\'")}', this.value, '${region}')">${yearOpts}</select>
    <label>Hudud:</label>
    <select onchange="loadPrices(${id},'${name.replace(/'/g,"\\'")}', '${year}', this.value)">${regionOpts}</select>`;

  try {
    const params = new URLSearchParams();
    if (year) params.set('year', year);
    if (region) params.set('region', region);
    const qs = params.toString() ? `?${params.toString()}` : "";
    const d = await get(`/models/${id}/prices${qs}`);
    const off = d.official_price;
    const mp = d.market_prices || [];
    const rows = mp.map(p => `
      <tr>
        <td>${p.year ?? '—'}</td>
        <td>${p.status === 'ok' ? fmt(p.amount) : '<span class="muted">'+(p.status||'')+'</span>'}</td>
        <td>${p.sample_size ?? 0}</td>
      </tr>`).join("");
    el.innerHTML = `
      <div class="detail">
        <h2>${name} ${year?`— ${year}`:''} ${region?`(${region})`:''}</h2>
        <div class="pricebox">
          <div class="pb-official">
            <div class="price-label">🏢 Salon narxi (rasmiy)</div>
            <div class="pb-big" style="color:#16a34a">${price(off)}</div>
          </div>
          <div class="pb-market">
            <div class="price-label">📊 Bozor medianasi</div>
            <div class="pb-big" style="color:#2563eb">${mp[0] && mp[0].status==='ok' ? fmt(mp[0].amount) : '—'}</div>
          </div>
        </div>
        <h3 style="margin-bottom:8px">Yillar bo'yicha bozor narxi</h3>
        <table>
          <thead><tr><th>Yil</th><th>Mediana narx</th><th>Namuna</th></tr></thead>
          <tbody>${rows || '<tr><td colspan=3 class="muted">Ma\'lumot yo\'q</td></tr>'}</tbody>
        </table>
      </div>`;
  } catch (e) { el.innerHTML = '<div class="err">Xato: ' + e.message + '</div>'; }
}

loadBrands();
</script>
</body>
</html>
